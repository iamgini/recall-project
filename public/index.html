<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recall — Bookmark Search</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1><span>Recall</span></h1>
      <p>Find your bookmarks with simple search</p>
    </header>

    <div class="search-box">
      <span class="icon">&#x1F50D;</span>
      <input type="text" id="search-input" placeholder="Search bookmarks..." autocomplete="off" autofocus>
    </div>

    <div class="stats">
      <span id="stat-total">0 bookmarks</span>
    </div>

    <div class="toolbar">
      <button class="btn" id="btn-add">+ Add</button>
      <button class="btn" id="btn-import">Import</button>
      <button class="btn" id="btn-tags-toggle">Tags</button>
      <button class="btn btn-sm" id="btn-settings" style="margin-left:auto">Settings</button>
    </div>

    <!-- Add Bookmark Panel -->
    <div class="panel" id="add-panel">
      <h3>Add Bookmark</h3>
      <form id="add-form">
        <div class="form-group">
          <label for="add-url">URL</label>
          <input type="url" id="add-url" placeholder="https://example.com" required>
          <div class="loading-indicator" id="meta-loading" style="display:none"></div>
        </div>
        <div class="form-group">
          <label for="add-title">Title</label>
          <input type="text" id="add-title" placeholder="Auto-filled from page">
        </div>
        <div class="form-group">
          <label for="add-desc">Description</label>
          <textarea id="add-desc" placeholder="Auto-filled from page"></textarea>
        </div>
        <div class="form-group">
          <label for="add-tags">Tags (comma-separated)</label>
          <input type="text" id="add-tags" placeholder="python, tutorial, devops">
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:0.5rem">
          <input type="checkbox" id="add-secret">
          <label for="add-secret" style="margin:0;cursor:pointer">Secret (hidden without API key)</label>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn" onclick="document.getElementById('add-panel').classList.remove('active')">Cancel</button>
        </div>
      </form>
    </div>

    <!-- Import Panel -->
    <div class="panel" id="import-panel">
      <h3>Import Chrome Bookmarks</h3>
      <p style="font-size: 0.85rem; color: var(--text-dim); margin-bottom: 1rem;">
        Export from Chrome: Bookmarks Manager &rarr; &#8942; &rarr; Export bookmarks. Then upload the HTML file here.
      </p>
      <div class="import-zone" id="import-zone">
        <p>Drop bookmark HTML file here or click to browse</p>
        <input type="file" id="import-file" accept=".html,.htm">
      </div>
      <div id="import-result"></div>
    </div>

    <!-- Settings Panel -->
    <div class="panel" id="settings-panel">
      <h3>Settings</h3>
      <form id="settings-form">
        <div class="form-group">
          <label for="settings-key">API Key (required for add/edit/delete)</label>
          <input type="password" id="settings-key" placeholder="Your RECALL_API_KEY">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn" onclick="document.getElementById('settings-panel').classList.remove('active')">Cancel</button>
        </div>
      </form>
    </div>

    <!-- Tags Bar (collapsible) -->
    <div class="tags-bar" id="tags-bar" style="display:none"></div>

    <!-- Results -->
    <ul class="results" id="results"></ul>

    <footer>
      <a href="https://github.com/iamgini/recall-project" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
